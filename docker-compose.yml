services:
  youtube-mcp:
    build: .
    image: youtube-mcp-server:latest
    container_name: youtube-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      PORT: 3000
    # Not exposed publicly: Caddy forwards HTTPS traffic to it.
    # If you use your own reverse proxy instead of Caddy, remove the caddy
    # service below and uncomment this to bind the port to localhost only:
    # ports:
    #   - "127.0.0.1:3000:3000"

  # Automatic HTTPS (Let's Encrypt) — claude.ai requires a public HTTPS URL.
  caddy:
    image: caddy:2-alpine
    container_name: youtube-mcp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - youtube-mcp

volumes:
  caddy_data:
  caddy_config:
