services:
  youtube-mcp:
    build: .
    image: youtube-mcp-server:latest
    container_name: youtube-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      PORT: 3000
    # Joins Nginx Proxy Manager's Docker network so NPM can reach it as
    # http://youtube-mcp:3000 without exposing any port on the host.
    networks:
      - npm

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
